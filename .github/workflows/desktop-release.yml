name: Desktop release

# Pushing a desktop-v<version> tag builds the macOS (Apple silicon), Linux x64
# and Windows x64 packages and uploads them, with SHA256SUMS.txt, to the
# GitHub Release of that tag in RELEASE_REPO (simplexai-labs/linger unless the
# variable says otherwise). Stable tags create a draft release so release notes
# are attached before notifying subscribers or updating releases/latest
# (`scripts/ci/desktop-release.sh publish`); versions with a hyphen publish
# immediately as prereleases. A manual run builds a version from the chosen
# branch and keeps the files as workflow artifacts unless "publish" is set.
# scripts/ci/desktop-release.sh does the work; docs/desktop-release.md lists
# the variables and secrets. This is the only workflow that publishes desktop
# releases.
on:
  push:
    tags: ["desktop-v*", "shell-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, such as 0.16.33 or 0.16.33-rc.1
        required: true
      publish:
        description: Also create the desktop-v<version> release at this commit
        type: boolean
        default: false
      shared_node_runtime:
        description: V2 shell mode — share a single Node.js 26 runtime instead of bundling Node twice
        type: boolean
        default: false
      build_v2_test_pack:
        description: V2 non-release test mode — build signed 3-platform baseline installers + all 8 per-service signed upgrade packs as Artifacts ONLY (hard-locks publish=false)
        type: boolean
        default: false
      v2_feed_base_url:
        description: Optional fixed HTTPS feed URL for V2 test upgrade packs; leave empty (recommended) for portable feed-relative signed manifests
        type: string
        default: ""
      require_macos_signing:
        description: When build_v2_test_pack=true, fail fast if macOS Developer ID / Notary / Ed25519 secrets are missing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  # owner/name of the repository that receives the release.
  RELEASE_REPO: ${{ vars.RELEASE_REPO || 'simplexai-labs/linger' }}
  # https folder serving the PostgreSQL and voice tools archives that
  # apps/desktop/distribution/*.json pin: the assets of the native-deps
  # prerelease, unless a secret or variable names another folder.
  LINGER_NATIVE_DEPS_URL: ${{ secrets.LINGER_NATIVE_DEPS_URL || vars.LINGER_NATIVE_DEPS_URL || 'https://github.com/simplexai-labs/linger/releases/download/native-deps' }}
  # rcodesign reads RCODESIGN_* variables as its configuration, so these
  # carry another prefix.
  APPLE_CODESIGN_VERSION: 0.29.0
  APPLE_CODESIGN_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
      v2_test_pack: ${{ steps.version.outputs.v2_test_pack }}
      v2_base_url: ${{ steps.version.outputs.v2_base_url }}
      has_macos_signing: ${{ steps.version.outputs.has_macos_signing }}
      has_windows_signing: ${{ steps.version.outputs.has_windows_signing }}
      has_update_key: ${{ steps.version.outputs.has_update_key }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        env:
          INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          V2_TEST_PACK: ${{ github.event_name == 'workflow_dispatch' && inputs.build_v2_test_pack || false }}
          V2_FEED_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.v2_feed_base_url || '' }}
          REQUIRE_MACOS_SIGNING: ${{ github.event_name == 'workflow_dispatch' && inputs.require_macos_signing || false }}
          HAS_RELEASE_TOKEN: ${{ secrets.LINGER_RELEASE_TOKEN != '' }}
          HAS_MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 != '' && secrets.MACOS_DEVELOPER_ID_PASSWORD != '' }}
          HAS_MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_JSON != '' }}
          HAS_WINDOWS_SIGNING: ${{ secrets.WINDOWS_SIGNING_P12_BASE64 != '' && secrets.WINDOWS_SIGNING_PASSWORD != '' }}
          HAS_UPDATE_KEY: ${{ secrets.DESKTOP_UPDATE_KEY_PEM != '' }}
        run: |
          set -euo pipefail
          scripts/ci/desktop-release.sh version "$INPUT" | tee -a "$GITHUB_OUTPUT"
          if [ "$V2_TEST_PACK" = true ]; then
            # HARD LOCK: V2 test pack mode is Artifacts-only and NEVER creates a GitHub Release or tag.
            PUBLISH=false
          fi
          echo "publish=$PUBLISH" >>"$GITHUB_OUTPUT"
          echo "v2_test_pack=$V2_TEST_PACK" >>"$GITHUB_OUTPUT"
          echo "has_macos_signing=$HAS_MACOS_DEVELOPER_ID" >>"$GITHUB_OUTPUT"
          echo "has_windows_signing=$HAS_WINDOWS_SIGNING" >>"$GITHUB_OUTPUT"
          echo "has_update_key=$HAS_UPDATE_KEY" >>"$GITHUB_OUTPUT"
          if [ -n "$V2_FEED_URL" ]; then
            if [[ "$V2_FEED_URL" != https://* ]]; then
              echo "::error::v2_feed_base_url must start with https:// or be left empty for portable relative URLs"
              exit 1
            fi
            echo "v2_base_url=$V2_FEED_URL" >>"$GITHUB_OUTPUT"
          else
            echo "v2_base_url=relative" >>"$GITHUB_OUTPUT"
          fi
          if [ "$V2_TEST_PACK" = true ] && [ "$REQUIRE_MACOS_SIGNING" = true ]; then
            missing=()
            [ "$HAS_MACOS_DEVELOPER_ID" = true ] || missing+=(MACOS_DEVELOPER_ID_P12_BASE64/MACOS_DEVELOPER_ID_PASSWORD)
            [ "$HAS_MACOS_NOTARY_KEY" = true ] || missing+=(MACOS_NOTARY_KEY_JSON)
            [ "$HAS_UPDATE_KEY" = true ] || missing+=(DESKTOP_UPDATE_KEY_PEM)
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "::error::Signed V2 test pack requires existing repository secrets: ${missing[*]}"
              exit 1
            fi
          fi
          # Stop before building when the release could not be published or
          # when an official simplexai-labs/linger release lacks required
          # signing/update credentials.
          if [ "$PUBLISH" = true ] && [ "$RELEASE_REPO" != "$GITHUB_REPOSITORY" ] && [ "$HAS_RELEASE_TOKEN" != true ]; then
            echo "::error::Publishing to $RELEASE_REPO from $GITHUB_REPOSITORY needs the LINGER_RELEASE_TOKEN secret, a token with contents write access to $RELEASE_REPO (see docs/desktop-release.md)."
            exit 1
          fi
          if [ "$PUBLISH" = true ] && [ "$RELEASE_REPO" = simplexai-labs/linger ]; then
            missing=()
            [ "$HAS_MACOS_DEVELOPER_ID" = true ] || missing+=(MACOS_DEVELOPER_ID_P12_BASE64/MACOS_DEVELOPER_ID_PASSWORD)
            [ "$HAS_MACOS_NOTARY_KEY" = true ] || missing+=(MACOS_NOTARY_KEY_JSON)
            [ "$HAS_UPDATE_KEY" = true ] || missing+=(DESKTOP_UPDATE_KEY_PEM)
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "::error::Publishing to $RELEASE_REPO requires secrets: ${missing[*]} (see docs/desktop-release.md)."
              exit 1
            fi
          fi
          echo "Release repository: $RELEASE_REPO (v2_test_pack=$V2_TEST_PACK, publish=$PUBLISH)"

  build:
    needs: prepare
    # The packaging scripts build the DMG and the Windows installer on Linux
    # with Docker, which the macOS and Windows runners do not offer.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, linux-x64]
        include:
          - target: darwin-arm64
            docker_image: dmgtool
          - target: linux-x64
            docker_image: ""
    env:
      DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_OUT: ${{ github.workspace }}/.linger-runtime/desktop-release
      LINGER_NATIVE_POSTGRES_DIR: ${{ github.workspace }}/.linger-runtime/native-deps
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/desktop-build
        with:
          target: ${{ matrix.target }}
          docker-image: ${{ matrix.docker_image }}
          require-macos-signing: ${{ (needs.prepare.outputs.publish == 'true' && env.RELEASE_REPO == 'simplexai-labs/linger') || (needs.prepare.outputs.v2_test_pack == 'true' && inputs.require_macos_signing) }}
          ghcr-token: ${{ github.token }}
          diagnostics-upload-url: ${{ secrets.LINGER_DIAGNOSTICS_UPLOAD_URL }}
          macos-developer-id-p12-base64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          macos-developer-id-password: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          macos-notary-key-json: ${{ secrets.MACOS_NOTARY_KEY_JSON }}

  # Split from the build matrix so windows-smoke starts as soon as win32-x64
  # finishes instead of waiting for darwin-arm64 packaging and notarization.
  build-win32:
    name: build (win32-x64)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_OUT: ${{ github.workspace }}/.linger-runtime/desktop-release
      LINGER_NATIVE_POSTGRES_DIR: ${{ github.workspace }}/.linger-runtime/native-deps
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/desktop-build
        with:
          target: win32-x64
          docker-image: wintool
          ghcr-token: ${{ github.token }}
          diagnostics-upload-url: ${{ secrets.LINGER_DIAGNOSTICS_UPLOAD_URL }}
          windows-signing-p12-base64: ${{ secrets.WINDOWS_SIGNING_P12_BASE64 }}
          windows-signing-password: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}

  windows-smoke:
    needs: [prepare, build-win32]
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: Linger-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe
          path: candidate
          skip-decompress: true
      - uses: actions/download-artifact@v8
        with:
          name: windows-setup.sha256
          path: candidate
          skip-decompress: true
      - name: Smoke the packaged Pi runtime with its managed MCP extension
        shell: powershell
        env:
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $setup = "candidate\Linger-$env:DESKTOP_VERSION-windows-x64-setup.exe"
          $digest = (Get-Content -LiteralPath 'candidate\windows-setup.sha256' -Raw).Split(' ')[0]
          scripts/ci/windows-desktop-smoke.ps1 -Setup $setup -ExpectedSha256 $digest

  # Non-release V2 per-service signed upgrade pack builder. Runs ONLY when
  # workflow_dispatch sets build_v2_test_pack=true; uploads all 8 signed steps
  # (step-00-baseline..step-07-rollback-faulty) + serve-test-feed.mjs + guide
  # as the `v2-test-service-upgrade-packs` Artifact. Never publishes a release.
  build-v2-service-upgrade-packs:
    name: v2 per-service signed upgrade packs
    needs: prepare
    if: needs.prepare.outputs.v2_test_pack == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache/restore@v6
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/teamhub/go.sum', 'apps/computer/local-daemon/go.sum', 'contracts/generated/go/go.sum') }}
          restore-keys: gomod-${{ runner.os }}-${{ runner.arch }}-
      - name: Install rcodesign for macOS binary signing
        if: needs.prepare.outputs.has_macos_signing == 'true'
        shell: bash
        run: |
          set -euo pipefail
          name="apple-codesign-$APPLE_CODESIGN_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/rcodesign.tar.gz" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$APPLE_CODESIGN_VERSION/$name.tar.gz"
          echo "$APPLE_CODESIGN_SHA256  $RUNNER_TEMP/rcodesign.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/rcodesign.tar.gz" -C "$RUNNER_TEMP"
          echo "RCODESIGN=$RUNNER_TEMP/$name/rcodesign" >>"$GITHUB_ENV"
      - name: Install osslsigncode for Windows binary signing
        if: needs.prepare.outputs.has_windows_signing == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 update -q &&
            sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 install -y -q osslsigncode
      - name: Build real noarch & 3-platform Go payloads for step-00..step-07
        shell: bash
        env:
          BASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/v2-stage"
          rm -rf "$stage"
          mkdir -p "$stage"/{teamhub-v0,teamhub-v4,teamhub-faulty,daemon-v0,daemon-v5,teamhub-cli,node-services}

          pnpm --filter @linger/web run build:assets --skip-precompress
          node apps/linger-installer/scripts/build.mjs
          node apps/teamhub-cli/scripts/build-cli.mjs --outdir "$stage/teamhub-cli"
          cp apps/desktop/scripts/teamhub.sh "$stage/teamhub-cli/teamhub"
          chmod +x "$stage/teamhub-cli/teamhub"
          printf '@echo off\r\nsetlocal\r\nset "app=%%~dp0..\\..\\..\\..\\Linger.exe"\r\nif not exist "%%app%%" set "app=node"\r\nset ELECTRON_RUN_AS_NODE=1\r\n"%%app%%" --use-env-proxy "%%~dp0teamhub.js" %%*\r\n' >"$stage/teamhub-cli/teamhub.cmd"

          if [ -d apps/node-services/src ] && [ -d apps/voice-runtime/src ]; then
            node apps/desktop/scripts/bundle-node-services.mjs "$PWD" "$stage/node-services"
            if [ -d apps/node-services/prompts ]; then
              cp -r apps/node-services/prompts "$stage/node-services/prompts"
            fi
          else
            rm -rf "$stage/node-services"
          fi

          ver_v4=$(node --input-type=module -e 'import {deriveStepVersions} from "./apps/desktop/scripts/build-v2-test-upgrade-packs.mjs"; console.log(deriveStepVersions(process.argv[1])["step-04-teamhub"])' "$BASE_VERSION")
          ver_v5=$(node --input-type=module -e 'import {deriveStepVersions} from "./apps/desktop/scripts/build-v2-test-upgrade-packs.mjs"; console.log(deriveStepVersions(process.argv[1])["step-05-computer-daemon"])' "$BASE_VERSION")
          ver_v7=$(node --input-type=module -e 'import {deriveStepVersions} from "./apps/desktop/scripts/build-v2-test-upgrade-packs.mjs"; console.log(deriveStepVersions(process.argv[1])["step-07-rollback-faulty"])' "$BASE_VERSION")

          faulty_src="$RUNNER_TEMP/faulty-teamhub"
          mkdir -p "$faulty_src"
          cat >"$faulty_src/go.mod" <<'GOMOD'
          module linger-v2-faulty-probe
          go 1.22
          GOMOD
          cat >"$faulty_src/main.go" <<EOF
          package main

          import (
          	"fmt"
          	"os"
          )

          func main() {
          	fmt.Fprintf(os.Stderr, "[V2-TEST-FAULTY-${ver_v7}] intentional startup crash to verify pg_dump/pg_restore + automatic rollback + denylist\\n")
          	os.Exit(42)
          }
          EOF

          declare -A GOOS_MAP=( [darwin-arm64]=darwin [win32-x64]=windows [linux-x64]=linux )
          declare -A GOARCH_MAP=( [darwin-arm64]=arm64 [win32-x64]=amd64 [linux-x64]=amd64 )

          for target in darwin-arm64 win32-x64 linux-x64; do
            goos="${GOOS_MAP[$target]}"
            goarch="${GOARCH_MAP[$target]}"
            ext=""
            [ "$goos" = "windows" ] && ext=".exe"

            mkdir -p "$stage/teamhub-v0/$target" "$stage/teamhub-v4/$target" "$stage/teamhub-faulty/$target"
            mkdir -p "$stage/daemon-v0/$target" "$stage/daemon-v5/$target"

            (
              cd apps/teamhub
              for cmd in teamhub migrate account; do
                CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" GOFLAGS="-buildvcs=false" \
                  go build -trimpath -ldflags "-s -w" \
                  -o "$stage/teamhub-v0/$target/${cmd}${ext}" "./cmd/${cmd}"
              done
              for cmd in teamhub migrate account; do
                CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" GOFLAGS="-buildvcs=false" \
                  go build -trimpath -ldflags "-s -w -buildid=linger-v2-${ver_v4}/${target}/${cmd}" \
                  -o "$stage/teamhub-v4/$target/${cmd}${ext}" "./cmd/${cmd}"
              done
            )

            cp "$stage/teamhub-v4/$target/migrate${ext}" "$stage/teamhub-faulty/$target/migrate${ext}"
            cp "$stage/teamhub-v4/$target/account${ext}" "$stage/teamhub-faulty/$target/account${ext}"
            (
              cd "$faulty_src"
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" GOFLAGS="-buildvcs=false" \
                go build -trimpath -ldflags "-s -w" \
                -o "$stage/teamhub-faulty/$target/teamhub${ext}" .
            )

            (
              cd apps/computer/local-daemon
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" GOFLAGS="-buildvcs=false" \
                go build -trimpath \
                -ldflags "-s -w -X github.com/simplexai-labs/linger/apps/computer/local-daemon/internal/linger/transport.ReleaseVersion=${BASE_VERSION}" \
                -o "$stage/daemon-v0/$target/linger-computer-daemon${ext}" ./cmd/linger-computer-daemon
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" GOFLAGS="-buildvcs=false" \
                go build -trimpath \
                -ldflags "-s -w -X github.com/simplexai-labs/linger/apps/computer/local-daemon/internal/linger/transport.ReleaseVersion=${ver_v5}" \
                -o "$stage/daemon-v5/$target/linger-computer-daemon${ext}" ./cmd/linger-computer-daemon
            )
          done
      - name: Sign macOS (rcodesign) and Windows (osslsigncode) binaries in upgrade packs
        shell: bash
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          WINDOWS_SIGNING_P12_BASE64: ${{ secrets.WINDOWS_SIGNING_P12_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          stage="$RUNNER_TEMP/v2-stage"
          keys="$RUNNER_TEMP/v2-signing"
          mkdir -p "$keys"

          if [ -n "$MACOS_DEVELOPER_ID_P12_BASE64" ] && [ -n "${RCODESIGN:-}" ]; then
            base64 -d <<<"$MACOS_DEVELOPER_ID_P12_BASE64" >"$keys/developer-id.p12"
            printf '%s' "$MACOS_DEVELOPER_ID_PASSWORD" >"$keys/developer-id.password"
            for bin in \
              "$stage/teamhub-v0/darwin-arm64/teamhub" \
              "$stage/teamhub-v0/darwin-arm64/migrate" \
              "$stage/teamhub-v0/darwin-arm64/account" \
              "$stage/teamhub-v4/darwin-arm64/teamhub" \
              "$stage/teamhub-v4/darwin-arm64/migrate" \
              "$stage/teamhub-v4/darwin-arm64/account" \
              "$stage/teamhub-faulty/darwin-arm64/teamhub" \
              "$stage/teamhub-faulty/darwin-arm64/migrate" \
              "$stage/teamhub-faulty/darwin-arm64/account" \
              "$stage/daemon-v0/darwin-arm64/linger-computer-daemon" \
              "$stage/daemon-v5/darwin-arm64/linger-computer-daemon"; do
              "$RCODESIGN" sign \
                --p12-file "$keys/developer-id.p12" \
                --p12-password-file "$keys/developer-id.password" \
                --for-notarization \
                --code-signature-flags runtime \
                "$bin"
            done
          fi

          if [ -n "$WINDOWS_SIGNING_P12_BASE64" ]; then
            base64 -d <<<"$WINDOWS_SIGNING_P12_BASE64" >"$keys/authenticode.p12"
            printf '%s' "$WINDOWS_SIGNING_PASSWORD" >"$keys/authenticode.password"
            for exe in \
              "$stage/teamhub-v0/win32-x64/teamhub.exe" \
              "$stage/teamhub-v0/win32-x64/migrate.exe" \
              "$stage/teamhub-v0/win32-x64/account.exe" \
              "$stage/teamhub-v4/win32-x64/teamhub.exe" \
              "$stage/teamhub-v4/win32-x64/migrate.exe" \
              "$stage/teamhub-v4/win32-x64/account.exe" \
              "$stage/teamhub-faulty/win32-x64/teamhub.exe" \
              "$stage/teamhub-faulty/win32-x64/migrate.exe" \
              "$stage/teamhub-faulty/win32-x64/account.exe" \
              "$stage/daemon-v0/win32-x64/linger-computer-daemon.exe" \
              "$stage/daemon-v5/win32-x64/linger-computer-daemon.exe"; do
              osslsigncode sign \
                -pkcs12 "$keys/authenticode.p12" \
                -readpass "$keys/authenticode.password" \
                -n Linger -h sha256 -ts http://timestamp.digicert.com \
                -in "$exe" -out "${exe}.signed"
              mv "${exe}.signed" "$exe"
            done
          fi
      - name: Assemble, Ed25519-sign, and verify all 8 steps (step-00..step-07)
        shell: bash
        env:
          BASE_VERSION: ${{ needs.prepare.outputs.version }}
          BASE_URL: ${{ needs.prepare.outputs.v2_base_url }}
          MACOS_SIGNED: ${{ needs.prepare.outputs.has_macos_signing }}
          WINDOWS_SIGNED: ${{ needs.prepare.outputs.has_windows_signing }}
          DESKTOP_UPDATE_KEY_PEM: ${{ secrets.DESKTOP_UPDATE_KEY_PEM }}
        run: |
          set -euo pipefail
          umask 077
          stage="$RUNNER_TEMP/v2-stage"
          out="$PWD/.linger-runtime/v2-test-service-upgrade-packs"
          extra_args=()
          if [ -d "$stage/node-services" ]; then
            extra_args+=(--node-services-dir "$stage/node-services")
          fi
          if [ -n "$DESKTOP_UPDATE_KEY_PEM" ]; then
            key="$RUNNER_TEMP/v2-signing/update.pem"
            mkdir -p "$(dirname "$key")"
            printf '%s\n' "$DESKTOP_UPDATE_KEY_PEM" >"$key"
            extra_args+=(--sign-key "$key")
          else
            extra_args+=(--ephemeral-test-key)
          fi
          node apps/desktop/scripts/build-v2-test-upgrade-packs.mjs \
            --out "$out" \
            --base-version "$BASE_VERSION" \
            --base-url "$BASE_URL" \
            --web-dist apps/web/dist \
            --installer-dist apps/linger-installer/dist \
            --teamhub-dir "$stage/teamhub-v0" \
            --teamhub-v2-dir "$stage/teamhub-v4" \
            --teamhub-faulty-dir "$stage/teamhub-faulty" \
            --daemon-dir "$stage/daemon-v0" \
            --daemon-v2-dir "$stage/daemon-v5" \
            --teamhub-cli-dir "$stage/teamhub-cli" \
            --macos-signed "$MACOS_SIGNED" \
            --windows-signed "$WINDOWS_SIGNED" \
            "${extra_args[@]}"
      - name: Remove temporary signing keys
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/v2-signing"
      - name: Write V2 test pack summary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            const idx = JSON.parse(fs.readFileSync(".linger-runtime/v2-test-service-upgrade-packs/manifest-index.json", "utf8"));
            const lines = [
              "## Linger V2 Signed Test Pack (Non-Release Artifacts Only)",
              "",
              `- **Baseline Version**: \`${idx.baseVersion}\``,
              `- **Ed25519 Signing**: \`${idx.signedWith}\``,
              `- **macOS Binary Signing**: \`${idx.macosSigned}\``,
              `- **Windows Binary Signing**: \`${idx.windowsSigned}\``,
              `- **Manifest URL Mode**: \`${idx.baseUrl}\``,
              "",
              "### Per-Service Signed Upgrade Steps",
              "| Step | Version | Changed Module(s) | Inherited | Rollback Safe | Signed |",
              "|---|---|---|---|---|---|",
              ...idx.steps.map(s => `| \`${s.id}\` | \`${s.appVersion}\` | \`${s.changedModules.join(", ")}\` | ${s.inheritedModules.length}/7 | ${s.rollbackSafe} | ${s.signed} |`),
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
      - uses: actions/upload-artifact@v7
        with:
          name: v2-test-service-upgrade-packs
          path: .linger-runtime/v2-test-service-upgrade-packs
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [prepare, build, build-win32, windows-smoke]
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.v2_test_pack != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: Linger-${{ needs.prepare.outputs.version }}-*
          path: release
          merge-multiple: true
          skip-decompress: true
      - uses: actions/download-artifact@v8
        with:
          name: windows-setup.sha256
          path: release
          skip-decompress: true
      - name: Verify the Windows Setup that passed smoke
        working-directory: release
        run: sha256sum -c windows-setup.sha256 && rm windows-setup.sha256
      # The signed update manifest over every platform's package. Official
      # simplexai-labs/linger releases require the key (prepare checks early);
      # forks without the key still publish with a warning and no manifest.
      - name: Sign the update manifest
        env:
          DESKTOP_UPDATE_KEY_PEM: ${{ secrets.DESKTOP_UPDATE_KEY_PEM }}
          DESKTOP_REQUIRE_UPDATE_KEY: ${{ env.RELEASE_REPO == 'simplexai-labs/linger' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$DESKTOP_UPDATE_KEY_PEM" ]; then
            key="$RUNNER_TEMP/update.pem"
            trap 'rm -f "$key"' EXIT
            printf '%s\n' "$DESKTOP_UPDATE_KEY_PEM" >"$key"
            export DESKTOP_UPDATE_KEY="$key"
          fi
          scripts/ci/desktop-release.sh manifest release "${{ needs.prepare.outputs.version }}"
      - run: scripts/ci/desktop-release.sh checksums release "${{ needs.prepare.outputs.version }}"
      # GITHUB_TOKEN can write only this repository; a release in another one
      # takes LINGER_RELEASE_TOKEN, which prepare checked.
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ env.RELEASE_REPO == github.repository && github.token || secrets.LINGER_RELEASE_TOKEN }}
        run: >-
          scripts/ci/desktop-release.sh github-release release
          "${{ needs.prepare.outputs.tag }}" "${{ needs.prepare.outputs.version }}"
